# EC2에서 사용하는 운영용 compose 파일.
# DB는 이 안에 없다 - RDS를 쓰므로 backend/.env의 DB_HOST가 RDS 엔드포인트를 가리킨다.
# 로컬 개발용 docker-compose.yml(핫리로드 볼륨 마운트, 로컬 postgres 컨테이너)과는 별개로 관리한다.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kfood-lens-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '3000:3000'
    # 레시피 시드(npm run seed:recipes)를 서버에서 실행하려면 이 두 CSV도 저장소와 함께 EC2로 올라와 있어야 함
    volumes:
      - ./레시피_기본정보_50선.csv:/레시피_기본정보_50선.csv:ro
      - ./레시피_재료정보_50선.csv:/레시피_재료정보_50선.csv:ro
